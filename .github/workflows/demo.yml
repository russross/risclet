name: Demo

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Both entry points share a deployment queue. Freshness is checked again before publication.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and Build Demo
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demo/ui/package-lock.json
      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot e2fsprogs jq
          command -v google-chrome
          command -v python3
      - name: Require published release for the Cargo version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          git ls-remote --exit-code --tags origin "refs/tags/v$version"
          gh api "repos/${{ github.repository }}/releases/tags/v$version" \
            | python3 .github/scripts/demo_version.py "$version" > demo-version.txt
          version=$(cat demo-version.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test and build published release demo
        env:
          GH_TOKEN: ${{ github.token }}
          RISCLET_VERSION: ${{ steps.version.outputs.version }}
        run: make -C demo test RISCLET_VERSION="$RISCLET_VERSION"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo/dist

  deploy:
    name: Deploy Demo
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check deployment freshness
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh api "repos/${{ github.repository }}/contents/Cargo.toml?ref=main" \
            --jq .content | base64 --decode > main-Cargo.toml
          latest=$(python3 -c 'import tomllib; print(tomllib.load(open("main-Cargo.toml", "rb"))["package"]["version"])')
          current=true
          if [ "$BUILT_VERSION" != "$latest" ]; then current=false; fi
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            main_sha=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
            if [ "$GITHUB_SHA" != "$main_sha" ]; then current=false; fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" = false ]; then echo "Skipping superseded demo build"; fi
      - uses: actions/configure-pages@v5
        if: steps.freshness.outputs.current == 'true'
      - uses: actions/deploy-pages@v4
        if: steps.freshness.outputs.current == 'true'
        id: deployment
