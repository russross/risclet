# .github/workflows/release.yml
# Workflow name
name: Release Build and Publish

# Controls when the workflow will run
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*' # Trigger on tags like v1.0.0, v2.3.4 etc.

# Permissions needed by the workflow to create releases and upload assets
permissions:
  contents: write

# Default settings for all jobs
defaults:
  run:
    shell: sh

# Environment variables available to all jobs
env:
  # Fail the build if there are warnings
  RUSTFLAGS: --deny warnings
  # Set the binary name of your crate here
  BINARY_NAME: "risclet"

jobs:
  prepare_release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      should_release: ${{ steps.release.outputs.should_release }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Read current package version
        id: current
        run: |
          VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '
            if (.packages | length) == 1 then .packages[0].version
            else error("expected exactly one Cargo package")
            end
          ')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout previous version
        if: github.ref_type == 'branch' && github.event.before != '0000000000000000000000000000000000000000'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: .release-previous
          ref: ${{ github.event.before }}

      - name: Read previous package version
        if: github.ref_type == 'branch'
        id: previous
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::Cannot determine the package version before this push"
            exit 1
          fi
          VERSION="$(cargo metadata \
            --manifest-path .release-previous/Cargo.toml \
            --locked \
            --no-deps \
            --format-version 1 | jq -er '
              if (.packages | length) == 1 then .packages[0].version
              else error("expected exactly one Cargo package")
              end
            ')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        id: release
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          TAG_NAME="v$CURRENT_VERSION"
          echo "should_release=false" >> "$GITHUB_OUTPUT"

          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "$TAG_NAME" ]; then
              echo "::error::Tag $REF_NAME does not match Cargo package version $CURRENT_VERSION"
              exit 1
            fi
          elif [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            if git rev-parse --verify "refs/tags/$TAG_NAME^{commit}" >/dev/null 2>&1; then
              echo "Cargo package version $CURRENT_VERSION is already tagged"
              exit 0
            fi
            echo "Retrying unpublished Cargo package version $CURRENT_VERSION"
          else
            python3 .github/scripts/release_version.py \
              "$PREVIOUS_VERSION" "$CURRENT_VERSION"
          fi

          PRECEDENCE_VERSION="${CURRENT_VERSION%%+*}"
          case "$PRECEDENCE_VERSION" in
            *-*) IS_PRERELEASE=true ;;
            *) IS_PRERELEASE=false ;;
          esac
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        if: steps.release.outputs.should_release == 'true' && github.ref_type == 'branch'
        run: cargo fmt --check

      - name: Lint
        if: steps.release.outputs.should_release == 'true' && github.ref_type == 'branch'
        run: cargo clippy --all-targets -- --deny warnings

      - name: Test
        if: steps.release.outputs.should_release == 'true' && github.ref_type == 'branch'
        run: cargo test

      - name: Create release tag
        if: steps.release.outputs.should_release == 'true' && github.ref_type == 'branch'
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          if TAG_COMMIT="$(git rev-parse --verify "refs/tags/$TAG_NAME^{commit}" 2>/dev/null)"; then
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG_NAME already points to $TAG_COMMIT"
              exit 1
            fi
            echo "Tag $TAG_NAME already points to this commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG_NAME" --message "Release $TAG_NAME" "$GITHUB_SHA"
          git push origin "$TAG_NAME"

  # This job uses a dedicated cross-compilation container for Linux builds.
  build_linux_with_cross:
    name: Build for ${{ matrix.target }} (using cross-rs)
    runs-on: ubuntu-latest
    needs: [prepare_release]
    if: needs.prepare_release.outputs.should_release == 'true'
    container:
      image: ghcr.io/cross-rs/cross:main

    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The cross container does not select a default Rust toolchain.
      - name: Set default Rust toolchain
        run: rustup default stable

      - name: Build binary with cross
        run: cross build --verbose --release --target ${{ matrix.target }}
      
      - name: Prepare Release Asset
        id: prepare_asset
        run: |
          TARGET="${{ matrix.target }}"
          # The output path for 'cross' is the same as 'cargo'
          SRC_PATH="target/$TARGET/release/${{ env.BINARY_NAME }}"
          # Asset name does not include version for a stable download URL
          ASSET_NAME="${{ env.BINARY_NAME }}-${TARGET}"
          
          echo "Source binary path: $SRC_PATH"
          echo "Final asset name: $ASSET_NAME"
          if [ ! -f "$SRC_PATH" ]; then
            echo "::error::Binary not found at $SRC_PATH"
            exit 1
          fi
          mv "$SRC_PATH" "$ASSET_NAME"
          echo "asset_path=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Create/Update Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare_release.outputs.tag_name }}
          files: ${{ steps.prepare_asset.outputs.asset_path }}
          draft: true
          prerelease: ${{ needs.prepare_release.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # This job handles the native macOS builds.
  build_macos:
    name: Build for ${{ matrix.target }} (on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [prepare_release]
    if: needs.prepare_release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --verbose --release --target ${{ matrix.target }}

      - name: Prepare Release Asset
        id: prepare_asset
        run: |
          TARGET="${{ matrix.target }}"
          SRC_PATH="target/$TARGET/release/${{ env.BINARY_NAME }}"
          # Asset name does not include version for a stable download URL
          ASSET_NAME="${{ env.BINARY_NAME }}-${TARGET}"
          
          echo "Source binary path: $SRC_PATH"
          echo "Final asset name: $ASSET_NAME"
          if [ ! -f "$SRC_PATH" ]; then
            echo "::error::Binary not found at $SRC_PATH"
            exit 1
          fi
          mv "$SRC_PATH" "$ASSET_NAME"
          echo "asset_path=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Create/Update Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare_release.outputs.tag_name }}
          files: ${{ steps.prepare_asset.outputs.asset_path }}
          draft: true
          prerelease: ${{ needs.prepare_release.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # This job runs after all builds are complete. It finalizes the release.
  publish_release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [prepare_release, build_linux_with_cross, build_macos]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          if ! command -v gh > /dev/null; then
             echo "GitHub CLI not found, installing..."
             sudo apt-get update && sudo apt-get install -y gh
          fi

      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare_release.outputs.tag_name }}
        run: |
          mkdir release-assets
          cd release-assets
          echo "Downloading assets for tag $TAG_NAME from ${{ github.repository }}..."
          gh release download "$TAG_NAME" --repo "${{ github.repository }}" --pattern '*'
          echo "Download complete. Files:"
          ls -l

      - name: Create Checksums File
        id: checksum
        run: |
          cd release-assets
          CHECKSUM_FILE="../SHA256SUMS"
          if [ -z "$(ls -A .)" ]; then
             echo "No assets found to checksum."
             touch "$CHECKSUM_FILE"
             echo "checksum_created=false" >> "$GITHUB_OUTPUT"
          else
             sha256sum ./* > "$CHECKSUM_FILE"
             echo "Generated SHA256SUMS file:"
             cat "$CHECKSUM_FILE"
             echo "checksum_created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Checksums and Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare_release.outputs.tag_name }}
        run: |
          if [ "${{ steps.checksum.outputs.checksum_created }}" = "true" ]; then
            echo "Uploading checksums..."
            gh release upload "$TAG_NAME" SHA256SUMS --clobber
          else
            echo "Skipping checksum upload as no assets were found."
          fi

          echo "Publishing release..."
          gh release edit "$TAG_NAME" --draft=false
