# .github/workflows/release.yml
# Workflow name
name: Release

# Controls when the workflow will run
on:
  push:
    branches:
      - main

# Permissions needed by the workflow to create releases and upload assets
permissions:
  contents: write

# Keep tag creation and publication ordered across release attempts.
concurrency:
  group: release
  cancel-in-progress: false

# Default settings for all jobs
defaults:
  run:
    shell: sh

env:
  # Set the binary name of your crate here
  BINARY_NAME: "risclet"

jobs:
  prepare_release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      should_release: ${{ steps.release.outputs.should_release }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read current package version
        id: current
        run: |
          VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '
            if (.packages | length) == 1 then .packages[0].version
            else error("expected exactly one Cargo package")
            end
          ')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A missing version tag allows failed tests or builds to retry on the next push.
      - name: Check release tag
        id: release
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
        run: |
          TAG_NAME="v$CURRENT_VERSION"
          echo "should_release=false" >> "$GITHUB_OUTPUT"

          if git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            echo "Cargo package version $CURRENT_VERSION is already tagged"
            exit 0
          fi
          echo "Releasing untagged Cargo package version $CURRENT_VERSION"

          PRECEDENCE_VERSION="${CURRENT_VERSION%%+*}"
          case "$PRECEDENCE_VERSION" in
            *-*) IS_PRERELEASE=true ;;
            *) IS_PRERELEASE=false ;;
          esac
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

  # Validation leaves the version untagged so corrected commits can retry it.
  validate:
    name: Test and Compile
    runs-on: ubuntu-latest
    needs: [prepare_release]
    if: needs.prepare_release.outputs.should_release == 'true'
    env:
      RUSTFLAGS: "--deny warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust tests
        run: cargo test --locked --all-targets

  # This job uses a dedicated cross-compilation container for Linux builds.
  build_linux_with_cross:
    name: Build for ${{ matrix.target }} (using cross-rs)
    runs-on: ubuntu-latest
    needs: [prepare_release]
    if: needs.prepare_release.outputs.should_release == 'true'
    env:
      RUSTFLAGS: "--deny warnings -C target-feature=+crt-static"
    container:
      image: ghcr.io/cross-rs/cross:main

    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - riscv64gc-unknown-linux-musl

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The cross container does not select a default Rust toolchain.
      - name: Set default Rust toolchain
        run: rustup default stable

      - name: Build binary with cross
        run: cross build --locked --verbose --release --target ${{ matrix.target }}
      
      - name: Prepare Release Asset
        id: prepare_asset
        run: |
          TARGET="${{ matrix.target }}"
          # The output path for 'cross' is the same as 'cargo'
          SRC_PATH="target/$TARGET/release/${{ env.BINARY_NAME }}"
          # Asset name does not include version for a stable download URL
          ASSET_NAME="${{ env.BINARY_NAME }}-${TARGET}"
          
          echo "Source binary path: $SRC_PATH"
          echo "Final asset name: $ASSET_NAME"
          if [ ! -f "$SRC_PATH" ]; then
            echo "::error::Binary not found at $SRC_PATH"
            exit 1
          fi
          if readelf -lW "$SRC_PATH" | grep -q ' INTERP '; then
            echo "::error::$SRC_PATH has a dynamic interpreter"
            exit 1
          fi
          if readelf -dW "$SRC_PATH" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "::error::$SRC_PATH has shared-library dependencies"
            exit 1
          fi
          mv "$SRC_PATH" "$ASSET_NAME"
          echo "asset_path=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Store release binary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ steps.prepare_asset.outputs.asset_path }}
          if-no-files-found: error
          overwrite: true

  # This job handles the native macOS builds.
  build_macos:
    name: Build for ${{ matrix.target }} (on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [prepare_release]
    if: needs.prepare_release.outputs.should_release == 'true'
    env:
      RUSTFLAGS: "--deny warnings"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --locked --verbose --release --target ${{ matrix.target }}

      - name: Prepare Release Asset
        id: prepare_asset
        run: |
          TARGET="${{ matrix.target }}"
          SRC_PATH="target/$TARGET/release/${{ env.BINARY_NAME }}"
          # Asset name does not include version for a stable download URL
          ASSET_NAME="${{ env.BINARY_NAME }}-${TARGET}"
          
          echo "Source binary path: $SRC_PATH"
          echo "Final asset name: $ASSET_NAME"
          if [ ! -f "$SRC_PATH" ]; then
            echo "::error::Binary not found at $SRC_PATH"
            exit 1
          fi
          mv "$SRC_PATH" "$ASSET_NAME"
          echo "asset_path=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Store release binary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ steps.prepare_asset.outputs.asset_path }}
          if-no-files-found: error
          overwrite: true

  # This job runs after all builds are complete. It finalizes the release.
  publish_release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [prepare_release, validate, build_linux_with_cross, build_macos]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Assemble every asset before creating the public version tag.
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        run: |
          cd release-assets
          test "$(find . -maxdepth 1 -type f -name 'risclet-*' | wc -l)" -eq 5
          sha256sum risclet-* > SHA256SUMS

      - name: Create release tag
        env:
          TAG_NAME: ${{ needs.prepare_release.outputs.tag_name }}
        run: |
          if TAG_COMMIT="$(git rev-parse --verify "refs/tags/$TAG_NAME^{commit}" 2>/dev/null)"; then
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG_NAME already points to $TAG_COMMIT"
              exit 1
            fi
            echo "Tag $TAG_NAME already points to this commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG_NAME" --message "Release $TAG_NAME" "$GITHUB_SHA"
          git push origin "$TAG_NAME"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare_release.outputs.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ needs.prepare_release.outputs.is_prerelease }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare_release.outputs.tag_name }}
        run: |
          gh release edit "$TAG_NAME" --draft=false

  # Only a published release starts the automatic demo build and deployment.
  demo:
    name: Build and Deploy Demo
    needs: [publish_release]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/demo.yml
